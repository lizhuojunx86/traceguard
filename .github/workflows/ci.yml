name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (incl. mcp extra)
        run: uv sync --python 3.12 --extra mcp

      - name: Run tests
        run: |
          set +e
          uv run pytest -q
          code=$?
          if [ $code -eq 5 ]; then
            echo "::warning::No tests collected — acceptable during stability baseline"
            exit 0
          fi
          exit $code

      - name: Ruff lint
        continue-on-error: true
        run: uv run ruff check .

      - name: Ruff format check
        continue-on-error: true
        run: uv run ruff format --check .

  # The traceguard SDK lives in packages/traceguard with its own uv project, so
  # the root job above never ran its suite. Run it here.
  #
  # Matrix: pyproject declares requires-python >=3.11, and this job tested only
  # 3.12 — so every version the package claims to support but one went
  # unexercised. That is not theoretical: an unescaped `%` in an argparse help
  # string was invisible on 3.12/3.13 (it raises only when --help is asked for)
  # and broke the `sources` CLI outright on 3.14, where `add_parser` validates
  # help strings eagerly. 3.11 is deliberately NOT in the matrix: adding it is a
  # separate decision about the floor, not about testing what we ship against.
  #
  # The matrix lives under its own job id, and an aggregate job below carries
  # the name `traceguard-sdk`. That is not cosmetic: main's branch protection
  # requires the status context `traceguard-sdk` verbatim, and GitHub reports a
  # matrix job under its RENDERED name (`traceguard-sdk (3.12)` and friends).
  # Putting the matrix on this job id directly would mean the required context
  # is never reported again and every PR to main sits unmergeable at
  # "Expected — Waiting for status to be reported".
  traceguard-sdk-matrix:
    runs-on: ubuntu-22.04
    strategy:
      # Every version reports; one failing does not hide the others.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    name: SDK suite (py${{ matrix.python-version }})
    defaults:
      run:
        working-directory: packages/traceguard
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the traceguard SDK
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run SDK tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

      # Blocking (no continue-on-error): the SDK is lint-clean and stays that way.
      # Lint and format are version-independent, so only one leg runs them.
      - name: Ruff lint
        if: matrix.python-version == '3.12'
        run: uv run ruff check .

      # Informational: the tree is not ruff-format-clean and never has been, so
      # this reports and does not gate. Enforcing format is a separate,
      # deliberate reformat of the whole package, not a side effect of this job.
      # (A count used to be quoted here; it was written once and then drifted —
      # 52 when added, 128 today. Run the step to see the current number.)
      - name: Ruff format check
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: uv run ruff format --check .

  # Aggregate gate. Reports under the exact context main's branch protection
  # requires, and fails if ANY matrix leg failed or was skipped/cancelled —
  # `needs.<job>.result` is "success" only when every leg succeeded.
  traceguard-sdk:
    runs-on: ubuntu-22.04
    needs: traceguard-sdk-matrix
    if: always()
    steps:
      - name: Every Python version passed
        run: |
          result='${{ needs.traceguard-sdk-matrix.result }}'
          echo "matrix result: $result"
          [ "$result" = 'success' ] || exit 1

  # Freeze guard: the tests that mechanically enforce the 1.0 contract — the
  # frozen public surface (__all__, 29 symbols), the normalizer golden hashes,
  # and the four look-ahead invariants — plus, since SPEC v1.1, the
  # traceguard.audit surface (its __all__, finding kinds, function parameters,
  # boundary statements) and the audit algo v1 golden hashes. Fast and zero-tolerance; intended to be a
  # REQUIRED status check on main so the freeze is enforced by mechanism, not
  # convention. A change that needs to touch these must do so deliberately (and,
  # for __all__ / golden, accept it is a major break).
  #
  # The README claim guard rides along here rather than in an advisory job: for
  # a tool that sells "your claims should match what was actually true", the
  # README advertising a capability the code does not have is a contract defect,
  # not a docs nit. It once drifted five releases behind (invariant 4 read
  # "planned" for four minors after it shipped) precisely because nothing
  # enforced it.
  contract-guard:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages/traceguard
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install the traceguard SDK
        run: uv sync --python 3.12

      - name: Enforce the frozen contract (public surface + golden hashes + invariants)
        run: >
          uv run pytest -q
          tests/test_public_api_surface.py
          tests/test_audit_api_surface.py
          tests/test_audit_canonical.py
          tests/test_normalizer_golden.py
          tests/test_validators_lookahead.py
          tests/test_validators_replay_lock.py
          tests/test_readme_claims.py

  # Real open-weight backend: install the contamination-hf extra (CPU torch) and
  # run the RUN_HF-gated tests for real, so MIN-K% / Min-K%++ on a tiny model is
  # actually exercised instead of perpetually skipped. Separate job so a slow or
  # flaky heavy-dep install never masks the fast SDK signal above.
  traceguard-contamination-hf:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages/traceguard
    env:
      UV_TORCH_BACKEND: cpu  # CPU-only torch wheels — far smaller, no CUDA libs
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install the SDK with the contamination-hf extra
        run: uv sync --python 3.12 --extra contamination-hf

      - name: Run the HF / Min-K%++ contamination lane (real tiny-gpt2)
        env:
          TRACEGUARD_RUN_HF_TESTS: "1"
        run: uv run pytest -q tests/test_contamination_logprobs.py
