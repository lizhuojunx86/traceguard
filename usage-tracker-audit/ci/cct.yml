# Transcript-accounting conformance for davila7/claude-code-templates.
# Copy to .github/workflows/conformance.yml in the claude-code-templates repo.
#
# Runs the I-1 dedup harness from lizhuojunx86/traceguard against the pushed
# commit: synthetic $HOME, known-exact totals, your own ConversationAnalyzer
# required directly, exit 0/1. Red on current main; green with PR #754's
# change. Also the only test-shaped check this analytics path has in CI.
name: transcript-accounting conformance

on:
  push:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the harness
        uses: actions/checkout@v4
        with:
          repository: lizhuojunx86/traceguard
          path: traceguard

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the dedup check against this commit
        working-directory: traceguard/usage-tracker-audit/cct-dedup-check
        run: ./run_check.sh --commit "$GITHUB_SHA"
